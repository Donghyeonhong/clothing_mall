<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLOSET</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-top">
          <a href="/">
            <h3 class="logo">CLOSET</h3>
          </a>
          <div class="header-actions">
            <a href=""><p>검색</p></a>
            <a href=""><p>로그인</p></a>
            <a href=""><p>장바구니</p></a>
          </div>
        </div>

        <nav class="header-nav">
          <a href="/">전체</a>
          <a href="/?category=Topwear">상의</a>
          <a href="/?category=Bottomwear">하의</a>
          <a href="/?category=Outerwear">아우터</a>
          <a href="/?category=Other">기타</a>
        </nav>
      </header>

      <div class="middle">
        <div class="count">
          <p>상품 {{ "{:,}".format(product_count) }}개</p>
        </div>
        <div class="filter">
          <select>
            <option>인기순</option>
            <option>최신순</option>
            <option>높은 가격순</option>
            <option>낮은 가격순</option>
          </select>
        </div>
      </div>

      <div class="product-list">
        {% for product in products %}
        <a href="/product/{{ product[3] }}">
          <div class="product-card">
            <img src="{{ product[2] }}" alt="상품이미지" />
            <p class="product-name">{{ product[0] }}</p>
            <p class="product-price">{{ "{:,}".format(product[1])}}원</p>
          </div>
        </a>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
